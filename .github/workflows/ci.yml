name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fast-test dependencies
        run: >-
          python -m pip install
          "PyYAML>=6.0" "Pillow>=10.0" "pypdf>=6.0,<7"
          "python-pptx>=1.0" "pytest>=8.0"

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run explicit dependency-light tests (not the full media suite)
        run: >-
          python -m pytest -q tests/test_core.py tests/test_research_spec.py
          tests/test_research_themes.py tests/test_research_layout.py
          tests/test_research_timeline.py tests/test_research_voice.py tests/test_native_styles.py

      - name: Inspect published Git files
        run: python scripts/audit_release.py --ref HEAD
